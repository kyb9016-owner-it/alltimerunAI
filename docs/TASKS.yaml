tasks:
- id: T001
  owner: ui
  title: Create core UI flow and screen spec
  inputs:
  - docs/ACCEPTANCE.md
  outputs:
  - ui/flows.md
  - ui/screens.md
  - ui/components.json
  dependencies: []
- id: T002
  owner: art
  title: Define art direction and base asset list
  inputs:
  - ui/screens.md
  outputs:
  - assets/ART_DIRECTION.md
  - assets/asset_list.json
  dependencies:
  - T001
- id: T003
  owner: story
  title: Define world and character dialogue pack
  inputs:
  - ui/flows.md
  outputs:
  - story/STORY_BIBLE.md
  - story/DIALOGUES.md
  dependencies:
  - T001
- id: T004
  owner: qa
  title: Generate QA plan and release checklist
  inputs:
  - docs/ACCEPTANCE.md
  - ui/flows.md
  - ui/screens.md
  outputs:
  - qa/TEST_PLAN.md
  - qa/TEST_CASES.yaml
  - qa/RELEASE_CHECKLIST.md
  dependencies:
  - T001
- id: T005
  owner: coder
  title: Create first playable task patch
  inputs:
  - docs/TASKS.yaml
  - docs/ACCEPTANCE.md
  - ui/screens.md
  outputs:
  - patches/changes.patch
  dependencies:
  - T001
  - T004
