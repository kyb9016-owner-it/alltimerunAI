tasks:
- id: T001
  owner: ui
  title: Create core UI flow and screen spec
  inputs:
  - docs/ACCEPTANCE.md
  outputs:
  - ui/flows.md
  - ui/screens.md
  - ui/components.json
  dependencies: []
- id: T002
  owner: art
  title: Define art direction and base asset list
  inputs:
  - ui/screens.md
  outputs:
  - assets/ART_DIRECTION.md
  - assets/asset_list.json
  dependencies:
  - T001
- id: T003
  owner: story
  title: Define world and character dialogue pack
  inputs:
  - ui/flows.md
  outputs:
  - story/STORY_BIBLE.md
  - story/DIALOGUES.md
  dependencies:
  - T001
- id: T004
  owner: qa
  title: Generate QA plan and release checklist
  inputs:
  - docs/ACCEPTANCE.md
  - ui/flows.md
  - ui/screens.md
  outputs:
  - qa/TEST_PLAN.md
  - qa/TEST_CASES.yaml
  - qa/RELEASE_CHECKLIST.md
  dependencies:
  - T001
- id: T005
  owner: monetization
  title: Create monetization state and integration plan
  inputs:
  - docs/ACCEPTANCE.md
  - ui/flows.md
  outputs:
  - docs/MONETIZATION_PLAN.md
  - docs/MONETIZATION_STATES.yaml
  dependencies:
  - T001
- id: T006
  owner: progression
  title: Define progression and save schema
  inputs:
  - docs/ACCEPTANCE.md
  outputs:
  - docs/PROGRESSION_SCHEMA.yaml
  - docs/SAVE_POLICY.md
  dependencies:
  - T001
- id: T007
  owner: analytics
  title: Define analytics event contract and KPIs
  inputs:
  - ui/flows.md
  - docs/ACCEPTANCE.md
  outputs:
  - qa/ANALYTICS_EVENTS.yaml
  - docs/KPI_DASHBOARD.md
  dependencies:
  - T001
- id: T008
  owner: balance
  title: Build balance matrix and playtest script
  inputs:
  - ui/flows.md
  outputs:
  - docs/BALANCE_MATRIX.yaml
  - qa/PLAYTEST_SCRIPT.md
  dependencies:
  - T001
- id: T009
  owner: release
  title: Prepare release plan and go/no-go checklist
  inputs:
  - docs/ACCEPTANCE.md
  - qa/TEST_PLAN.md
  outputs:
  - docs/RELEASE_PLAN.md
  - qa/GO_NO_GO_CHECKLIST.md
  dependencies:
  - T004
- id: T010
  owner: unity
  title: Generate Unity-focused implementation patch
  inputs:
  - ui/screens.md
  - docs/ACCEPTANCE.md
  outputs:
  - patches/unity_changes.patch
  dependencies:
  - T001
  - T006
- id: T011
  owner: coder
  title: Create first playable task patch
  inputs:
  - docs/TASKS.yaml
  - docs/ACCEPTANCE.md
  - ui/screens.md
  outputs:
  - patches/changes.patch
  dependencies:
  - T001
  - T004
  - T005
  - T006
